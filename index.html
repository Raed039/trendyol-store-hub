<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز إدارة متجر إكسسوارات الجوال</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #1a252f; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 8px; margin-top: 0; }
        .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        input { flex: 1; min-width: 150px; }
        button { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #219150; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: right; }
        th { background-color: #f8f9fa; color: #555; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-noon { background-color: #fff3cd; color: #856404; }
        .badge-trendyol { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 لوحة تشغيل المتجر (المخزون والطلبات)</h1>

        <!-- قسم إضافة طلب جديد -->
        <div class="card">
            <h2>تسجيل طلب جديد (نون / ترنديول)</h2>
            <div class="form-group">
                <input type="text" id="orderId" placeholder="رقم الطلب">
                <input type="text" id="sku" placeholder="كود المنتج (SKU)">
                <select id="platform">
                    <option value="نون">نون (Noon)</option>
                    <option value="ترنديول">ترنديول (Trendyol)</option>
                </select>
                <button onclick="addOrder()">تسجيل الطلب وخصم المخزون</button>
            </div>
        </div>

        <!-- قسم سجل الطلبات -->
        <div class="card">
            <h2>سجل الطلبات اليومية</h2>
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>كود SKU</th>
                        <th>المنصة</th>
                        <th>حالة الشحن (J&T)</th>
                    </tr>
                </thead>
                <tbody id="ordersTable">
                    <!-- تظهر الطلبات هنا -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function addOrder() {
            const orderId = document.getElementById('orderId').value;
            const sku = document.getElementById('sku').value;
            const platform = document.getElementById('platform').value;

            if(!orderId || !sku) {
                alert('يرجى تعبئة رقم الطلب وكود المنتج');
                return;
            }

            const table = document.getElementById('ordersTable');
            const row = table.insertRow(0);
            
            const badgeClass = platform === 'نون' ? 'badge-noon' : 'badge-trendyol';

            row.innerHTML = `
                <td>${orderId}</td>
                <td><strong>${sku}</strong></td>
                <td><span class="badge ${badgeClass}">${platform}</span></td>
                <td>جاهز للتسليم لـ J&T</td>
            `;

            document.getElementById('orderId').value = '';
            document.getElementById('sku').value = '';
        }
    </script>
</body>
</html>
